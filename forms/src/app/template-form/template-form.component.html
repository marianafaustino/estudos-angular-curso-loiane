<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="form-horizontal">
    <div class="form-group" [class.has-error]="!nome.valid && nome.touched">
        <div class="col-sm-12">
            <label for="nome">Nome</label>
        </div>
        <div class="col-sm-12">
            <input type="text" #nome="ngModel" class="form-control" id="nome" placeholder="Nome" name="nome" [(ngModel)]="usuario.nome" required>
        </div>
        <div *ngIf="!nome.valid && nome.touched" class="alert alert-danger" role="alert">Nome é obrigatório</div>
    </div>
    <div class="form-group" [class.has-error]="!email.valid && email.touched">
        <div class="col-sm-12">
            <label for="email">Email</label>
        </div>
        <div class="col-sm-12">
            <input type="email" #email="ngModel" class="form-control" id="email" placeholder="exemplo@email.com" name="email" [(ngModel)]="usuario.email" email required>
        </div>
        <div *ngIf="!email.valid && email.touched" class="alert alert-danger" role="alert">Email é obrigatório</div>
    </div>
    <div class="form-group">
        <div class="col-md-2" [class.has-error]="!cep.valid && cep.touched" [class.has-feedback]="!cep.valid && cep.touched">
            <label for="cep" class="control-label">Cep</label>
            <input type="text" class="form-control" id="cep" name="cep" ngModel required #cep="ngModel">
            <span class="glyphicon glyphicon-remove from-control-feedback" aria-hidden="true" *ngIf="!cep.valid && cep.touched"></span>
            <span class="sr-only" *ngIf="!cep.valid && cep.touched">(error)</span>
        </div>
        <div [class.has-error]="!numero.valid && numero.touched" [class.has-feedback]="!numero.valid && numero.touched">
            <div class="col-md-2">
                <label for="numero" class="control-label">Número</label>
            <input type="text" class="form-control" id="numero" name="numero" ngModel required #numero="ngModel">
            <span class="glyphicon glyphicon-remove from-control-feedback" aria-hidden="true" *ngIf="!numero.valid && numero.touched"></span>
            <span class="sr-only" *ngIf="!numero.valid && numero.touched">(error)</span>
            </div>
        </div>
        <div>
            <div class="col-md-2">
                <label for="complemento" class="control-label">Complemento</label>
                <input type="text" class="form-control" id="complemento" name="complemento" ngModel #complemento="ngModel">
            </div>
        </div>
    </div>
    <div class="form-group" [class.has-error]="!rua.valid && rua.touched">
        <div class="col-sm-12">
            <label for="rua">Rua</label>
        </div>
        <div class="col-sm-12">
            <input type="text" #rua="ngModel" class="form-control" id="rua" placeholder="Rua" name="rua" [(ngModel)]="usuario.rua" required>
        </div>
        <div *ngIf="!rua.valid && rua.touched" class="alert alert-danger" role="alert">Rua é obrigatório</div>
    </div>
    <div class="form-group" [class.has-error]="!bairro.valid && bairro.touched" [class.has-feedback]="!bairro.valid && bairro.touched">
        <div class="col-md-5">
            <label for="bairro" class="control-label col-md-3">Bairro</label>
            <input type="text" class="form-control col-md-3" id="bairro" name="bairro" ngModel required #bairro="ngModel">
            <span class="glyphicon glyphicon-remove from-control-feedback" aria-hidden="true" *ngIf="!bairro.valid && bairro.touched"></span>
            <span class="sr-only" *ngIf="!bairro.valid && bairro.touched">(error)</span>
        </div>
        <div class="col-md-4">
            <label for="cidade" class="control-label col-md-3">Cidade</label>
            <input type="text" class="form-control col-md-3" id="cidade" name="cidade" ngModel required #cidade="ngModel">
            <span class="glyphicon glyphicon-remove from-control-feedback" aria-hidden="true" *ngIf="!cidade.valid && cidade.touched"></span>
            <span class="sr-only" *ngIf="!cidade.valid && cidade.touched">(error)</span>
        </div>
        <div class="col-md-3">
            <label for="estado" class="control-label col-md-3">Estado</label>
            <input type="text" class="form-control col-md-3" id="estado" name="estado" ngModel required #estado="ngModel">
            <span class="glyphicon glyphicon-remove from-control-feedback" aria-hidden="true" *ngIf="!estado.valid && estado.touched"></span>
            <span class="sr-only" *ngIf="!estado.valid && estado.touched">(error)</span>
        </div>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="!f.valid">Submit</button>
    <app-form-debug [form]="f"></app-form-debug>
</form>
