<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="form-horizontal">
    <div class="form-group" [ngClass]="aplicaCssErro(nome)">
        <div class="col-sm-12">
            <label for="nome">Nome</label>
        </div>
        <div class="col-sm-12">
            <input type="text" #nome="ngModel" class="form-control" id="nome" placeholder="Nome" name="nome" [(ngModel)]="usuario.nome" required>
        </div>
        <app-campo-control-erro [mostrarErro]="verificaValidTouched(nome)" msgErro="Nome é obrigatório."></app-campo-control-erro>
    </div>
    <div class="form-group" [ngClass]="aplicaCssErro(email)">
        <div class="col-sm-12">
            <label for="email">Email</label>
        </div>
        <div class="col-sm-12">
            <input type="email" #email="ngModel" class="form-control" id="email" placeholder="exemplo@email.com" name="email" [(ngModel)]="usuario.email" email required>
        </div>
        <app-campo-control-erro [mostrarErro]="verificaValidTouched(email)" msgErro="Email é obrigatório."></app-campo-control-erro>
    </div>
    <div ngModelGroup="Endereco">
        <div class="form-group">
            <div class="col-md-2" [ngClass]="aplicaCssErro(cep)">
                <label for="cep" class="control-label">Cep</label>
                <input type="text" class="form-control" id="cep" name="cep" ngModel required #cep="ngModel" (blur)="consultaCEP($event)">
                <app-campo-control-erro [mostrarErro]="verificaValidTouched(cep)" msgErro="Cep é obrigatório."></app-campo-control-erro>
            </div>
            <div [ngClass]="aplicaCssErro(numero)">
                <div class="col-md-2">
                    <label for="numero" class="control-label">Número</label>
                <input type="text" class="form-control" id="numero" name="numero" ngModel required #numero="ngModel">
                <app-campo-control-erro [mostrarErro]="verificaValidTouched(numero)" msgErro="Número é obrigatório."></app-campo-control-erro>
                </div>
            </div>
            <div>
                <div class="col-md-2">
                    <label for="complemento" class="control-label">Complemento</label>
                    <input type="text" class="form-control" id="complemento" name="complemento" ngModel #complemento="ngModel">
                </div>
            </div>
        </div>
        <div class="form-group" [ngClass]="aplicaCssErro(rua)">
            <div class="col-sm-12">
                <label for="rua">Rua</label>
            </div>
            <div class="col-sm-12">
                <input type="text" #rua="ngModel" class="form-control" id="rua" placeholder="Rua" name="rua" [(ngModel)]="usuario.rua" required>
            </div>
            <app-campo-control-erro [mostrarErro]="verificaValidTouched(rua)" msgErro="Rua é obrigatório."></app-campo-control-erro>
        </div>
        <div class="form-group" [ngClass]="aplicaCssErro(bairro)">
            <div class="col-md-5">
                <label for="bairro" class="control-label col-md-3">Bairro</label>
                <input type="text" class="form-control col-md-3" id="bairro" name="bairro" ngModel required #bairro="ngModel">
                <app-campo-control-erro [mostrarErro]="verificaValidTouched(bairro)" msgErro="Bairro é obrigatório."></app-campo-control-erro>
            </div>
            <div class="col-md-4">
                <label for="cidade" class="control-label col-md-3">Cidade</label>
                <input type="text" class="form-control col-md-3" id="cidade" name="cidade" ngModel required #cidade="ngModel">
                <app-campo-control-erro [mostrarErro]="verificaValidTouched(cidade)" msgErro="Cidade é obrigatório."></app-campo-control-erro>
            </div>
            <div class="col-md-3">
                <label for="estado" class="control-label col-md-3">Estado</label>
                <input type="text" class="form-control col-md-3" id="estado" name="estado" ngModel required #estado="ngModel">
                <app-campo-control-erro [mostrarErro]="verificaValidTouched(estado)" msgErro="Estado é obrigatório."></app-campo-control-erro>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="!f.valid">Submit</button>
    <app-form-debug [form]="f"></app-form-debug>
</form>
